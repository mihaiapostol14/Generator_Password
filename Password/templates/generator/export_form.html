{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Export trigger button -->
<button
    type="button"
    class="btn custom-btn-secondary"
    id="exportTriggerBtn"
    data-bs-toggle="modal"
    data-bs-target="#exportModal"
>
    Export
</button>

<!-- Bootstrap 5.3 Modal Layout -->
<div
    class="modal fade"
    id="exportModal"
    tabindex="-1"
    aria-labelledby="exportModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">

            <div class="modal-header">
                <h5 class="modal-title" id="exportModalLabel">
                    Export Data
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    id="exportCloseBtn"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <form
                action="#"
                method="GET"
            >
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="fileFormatSelect" class="form-label">Export Format</label>
                        <select class="form-select form-control" id="fileFormatSelect" name="file_format">
                            <option value="txt" selected>TXT</option>
                            <option value="json">JSON</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="exportCancelBtn"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<link
    rel="stylesheet"
    href="{% static 'generator/css/export_form.css' %}"
>

<script
    defer
    src="{% static 'generator/js/export_form.js' %}"
></script>

{% endblock %}
