
{% load static %}


<!-- Export Modal -->
<div
    class="modal fade"
    id="exportModal"
    tabindex="-1"
    aria-labelledby="exportModalLabel"
    aria-hidden="true"
    data-bs-backdrop="false"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">

            <!-- Modal Header -->
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="exportModalLabel"
                >
                    Export Data
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    id="exportCloseBtn"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <!-- Export Form -->
            <form id="exportForm" method="post">
                {% csrf_token %}

                <div class="modal-body">
                    <div class="mb-3">
                        <label
                            for="fileFormatSelect"
                            class="form-label"
                        >
                            Export Format
                        </label>

                        <select
                            class="form-select"
                            id="fileFormatSelect"
                            name="file_format"
                        >
                            <option value="txt" selected>
                                TXT
                            </option>

                            <option value="json">
                                JSON
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="exportCancelBtn"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Export Modal Styles -->
<link
    rel="stylesheet"
    href="{% static 'generator/css/export_form.css' %}"
>

<!-- Export Logic -->
<script
    defer
    src="{% static 'generator/js/export_form.js' %}"
></script>
