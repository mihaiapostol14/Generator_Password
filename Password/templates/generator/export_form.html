{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Export trigger -->
<button
    type="button"
    class="btn custom-btn-secondary"
    data-bs-toggle="modal"
    data-bs-target="#exportModal"
    aria-controls="exportModal"
>
    Export
</button>

<!-- Keep the modal outside transformed or overflow-hidden wrappers -->
<div
    class="modal fade"
    id="exportModal"
    tabindex="-1"
    aria-labelledby="exportModalLabel"
    aria-hidden="true"
    data-bs-backdrop="true"
    data-bs-keyboard="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">

            <div class="modal-header">
                <h5 class="modal-title" id="exportModalLabel">
                    Export Data
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <form
                action="{% url 'generator:export' %}"
                method="POST"
            >
                {% csrf_token %}

                <div class="modal-body">
                    {{ form.file_format.errors }}
                    {{ form.file_format }}
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn custom-btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="btn custom-btn">
                        Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<link
    rel="stylesheet"
    href="{% static 'main/css/home.css' %}"
>

<script
    defer
    src="{% static 'main/js/home.js' %}"
></script>

{% endblock %}
